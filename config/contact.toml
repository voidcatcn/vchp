# ============================================================
# 联系方式配置（密文由 scripts/encrypt-contacts.mjs 生成）
# ------------------------------------------------------------
# 用法：node scripts/encrypt-contacts.mjs <人机验证答案>
#
# [[public]]  非加密联系：type（预设）+ value（复制）/ url（跳转）
# [[secrets]] 加密联系：name + type（预设）+ ciphertext + nonce
# label/icon 预设解析见 vite-plugin-contact-data（contact-presets）
# ============================================================

