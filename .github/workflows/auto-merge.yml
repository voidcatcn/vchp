name: Automerge Renovate PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.actor == 'renovate[bot]'
    steps:
      - name: Wait for all other checks to pass
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request.head.sha;
            const currentJob = 'automerge';
            const allowed = ['success', 'skipped', 'neutral'];

            while (true) {
              const { data } = await github.rest.checks.listForRef({
                owner, repo, ref: sha, per_page: 100
              });

              // 排除当前 job 自身，避免死锁
              const others = data.check_runs.filter(c => c.name !== currentJob);

              const failed = others.filter(c =>
                c.status === 'completed' && !allowed.includes(c.conclusion)
              );
              if (failed.length > 0) {
                core.setFailed(`Failed checks: ${failed.map(c => `${c.name}(${c.conclusion})`).join(', ')}`);
                return;
              }

              const pending = others.filter(c =>
                c.status === 'in_progress' || c.status === 'queued'
              );
              if (pending.length === 0) {
                console.log('All other checks passed!');
                break;
              }

              console.log(`Waiting for ${pending.length} check(s)...`);
              await new Promise(r => setTimeout(r, 10000));
            }

      - name: Merge PR
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
