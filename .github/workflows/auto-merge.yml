name: Automerge Renovate PRs

on:
  pull_request:
    # 监听 PR 的创建、更新和准备就绪事件
    types: [opened, synchronize, reopened, ready_for_review]

# 必须显式声明权限，否则 GITHUB_TOKEN 默认只有只读权限
permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    # 严格限制只处理 renovate[bot] 提交的 PR
    if: github.actor == 'renovate[bot]'
    steps:
      - name: Wait for all checks to pass
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10 # 轮询间隔(秒)
          # 核心逻辑：将 skipped 和 neutral 视作“不阻碍合并”的状态，只要其他跑完的 Check 都是 success 就放行
          allowed-conclusions: success,skipped,neutral

      - name: Merge PR
        # 状态机流转完毕后，执行 Squash 合并（推荐，保持 Git 历史整洁）
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
