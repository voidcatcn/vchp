name: Sync Posts Data

on:
  push:
    branches:
      - v3

permissions:
  contents: write

jobs:
  sync-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check and auto-commit
        run: |
          if ! git diff --quiet -- src/generated/posts-data.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/generated/posts-data.ts
            git commit -m "chore: auto-sync posts-data.ts [skip ci]"
            git push
          fi
